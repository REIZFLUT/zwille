tools.bookmarklet.title: Lesezeichen zum Kürzen
tools.bookmarklet.intro: 'Ziehe einen der Knöpfe unten in die Lesezeichenleiste deines Browsers. Auf einer beliebigen Seite kürzt er dann die aktuelle Adresse zu einem Kurzlink dieser Installation.'
