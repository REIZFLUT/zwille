# Zwille – ein vhost für Admin-Host und alle Kurzdomains.

server {
    listen 80;
    listen [::]:80;
    server_name links.firma.de go.firma.de jobs.firma.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # Admin-Host zuerst, dann alle Kurzdomains (oder ein Wildcard wie *.go.firma.de).
    server_name links.firma.de go.firma.de jobs.firma.de;

    ssl_certificate     /etc/letsencrypt/live/links.firma.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/links.firma.de/privkey.pem;

    root /var/www/zwille/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Kompilierte Assets tragen einen Hash im Namen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Keine anderen PHP-Dateien ausführen.
    location ~ \.php$ {
        return 404;
    }
}
