# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']

    session:
        # Symfony's defaults live in /var/lib/php/sessions, where Debian's cron purges
        # files after the php.ini gc_maxlifetime (1440s). Keeping sessions inside the
        # project makes gc_maxlifetime below authoritative and logs users out after 8h.
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/sessions'
        name: emsl_session
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true
        # PHP's own session GC only runs with a probability > 0, and Debian's php.ini sets
        # it to 0 (a system cron cleans /var/lib/php/sessions instead - not var/sessions).
        # Without this, expired session files would never be deleted here: stolen session
        # IDs would stay valid forever and the directory would grow without bound.
        gc_probability: 1
        gc_divisor: 100
        gc_maxlifetime: 28800

    rate_limiter:
        api:
            policy: sliding_window
            limit: 120
            interval: '1 minute'
        # Agent tokens: an extra budget per token for everything that changes data, on top
        # of the per-user "api" limit (see App\EventListener\ApiScopeListener).
        agent_write:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        agent_write_daily:
            policy: fixed_window
            limit: 300
            interval: '1 day'
        agent_delete_daily:
            policy: fixed_window
            limit: 20
            interval: '1 day'
        password_reset:
            policy: fixed_window
            limit: 5
            interval: '1 hour'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # No test may reach the network: every HttpClientInterface call answers with a
        # fixed HTML page (see tests/HttpClient/MockResponseFactory.php).
        http_client:
            mock_response_factory: 'App\Tests\HttpClient\MockResponseFactory'
